name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: slotly
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: slotly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slotly -d slotly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_URL: http://localhost:3000
      # Disposable CI service only; never a deployed database credential.
      DATABASE_URL: postgresql://slotly:ci-only-password@127.0.0.1:5432/slotly
      DATABASE_SSL: disable
      MAIL_TRANSPORT: local
      CIRCLE_NODE_TOTAL: '2'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run env:check
      - run: npm run repo:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
      - run: npm run test:integration -- --maxWorkers=1
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
